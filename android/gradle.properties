# Project-wide Gradle settings.

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx1536m

# AndroidX package structure
android.useAndroidX=true

# Performance improvements
# android.dependency.excludeLibraryComponentsFromConstraints is deprecated and removed in AGP 10.0
# Using android.dependency.useConstraints=false as a replacement behavior.
android.dependency.useConstraints=false

# Remaining non-deprecated settings
android.uniquePackageNames=false
android.r8.strictFullModeForKeepRules=false
